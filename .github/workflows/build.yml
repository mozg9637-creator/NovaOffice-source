name: build-installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Make icon
        run: python make_icon.py

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --windowed --name NovaOffice --icon icon.ico --add-data "icon.ico;." --paths app --collect-all pymupdf --collect-data docx --collect-data pptx --exclude-module tkinter app/main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: NovaOffice-Setup
          path: Output/NovaOffice-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/NovaOffice-Setup.exe
